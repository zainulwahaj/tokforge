[package]
name = "tokforge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fast BPE tokenizer with a from-scratch byte-level core, verified against reference implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zainulwahaj/tokforge"
readme = "README.md"
keywords = ["tokenizer", "bpe", "llm", "nlp", "tiktoken"]
categories = ["text-processing", "command-line-utilities"]

[lib]
name = "tokforge"
path = "src/lib.rs"

[[bin]]
name = "tokforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization-alignments = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "throughput"
harness = false
