[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tokforge"
description = "Fast BPE tokenizer with a from-scratch byte-level core, verified against reference implementations"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
keywords = ["tokenizer", "bpe", "llm", "tiktoken", "nlp"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/zainulwahaj/tokforge"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "tokforge"
