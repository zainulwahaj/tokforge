# Builds abi3 wheels and an sdist, and publishes them to PyPI through trusted
# publishing (OIDC, no API token) when a v* tag is pushed. Pull requests that
# touch packaging, and manual runs, build and test everything without
# publishing.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - python/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: tag matches crate version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          crate=$(grep -m1 '^version' python/Cargo.toml | cut -d'"' -f2)
          echo "tag ${GITHUB_REF_NAME#v}, python/Cargo.toml $crate"
          test "${GITHUB_REF_NAME#v}" = "$crate"

  wheels:
    name: wheel (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-latest, target: aarch64, test: false }
          - { os: windows-latest, target: x64, test: true }
          - { os: macos-14, target: aarch64, test: true }
          - { os: macos-14, target: x86_64, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist --manifest-path python/Cargo.toml
          manylinux: auto
      # Cross-compiled wheels cannot run on the build machine; the native ones
      # cover the same code.
      - name: Install the wheel and run the Python tests
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist tokforge
          python -m pytest python/tests -q -rs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      # The sdist has to carry the parent crate it depends on by path, so
      # prove it builds on its own, away from the checkout.
      - name: Build and import the sdist in isolation
        shell: bash
        run: |
          python -m venv /tmp/sdist-check
          cd /tmp
          /tmp/sdist-check/bin/pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          /tmp/sdist-check/bin/python -c "import tokforge; print(tokforge.Tokenizer)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [version, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/tokforge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
