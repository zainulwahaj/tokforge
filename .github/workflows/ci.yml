name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Reference and differential suites print SKIPPED here: model files are gitignored.
      - run: cargo test --all-targets --locked

  reference:
    name: reference artifacts and oracle goldens
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned artifacts and oracle files
        run: python -I models/fetch.py
      - name: Verify committed goldens are reproducible
        run: |
          python -m pip install -r tests/fixtures/golden/requirements.txt
          python -I tests/fixtures/golden/generate.py --check
      - name: Reference and differential suites must run, not skip
        env:
          FAST_TOKENIZER_REQUIRE_MODELS: "1"
        run: cargo test --release --locked --test reference --test bytelevel -- --show-output
      - name: Python package matches tiktoken on the real GPT-2 artifact
        run: |
          python -m pip install pytest ./python
          python -m pytest python/tests -q -rs

  python:
    name: python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tokforge-python --all-targets --locked -- -D warnings
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --manifest-path python/Cargo.toml
          manylinux: auto
      - name: Install the wheel and run the Python tests
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist tokforge
          python -m pytest python/tests -q -rs
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  release-binaries:
    name: release binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tokforge-linux-x86_64
            path: target/release/tokforge
          - os: windows-latest
            artifact: tokforge-windows-x86_64
            path: target/release/tokforge.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: ${{ matrix.path }} info
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
